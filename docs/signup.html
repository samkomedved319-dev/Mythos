<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Mythos</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🏛️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="signup">

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand"><span>M</span>ythos</a>
      <div class="navbar-links" id="nav-right">
        <a href="login.html">Login</a>
        <a href="signup.html" class="btn btn-primary btn-sm">Sign Up</a>
      </div>
    </div>
  </nav>

  <!-- Signup Form -->
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-header">
        <div class="logo"><span>M</span>ythos</div>
        <h1>Create your account</h1>
        <p>Get your personal API token to unlock the CLI.</p>
      </div>

      <div class="auth-card">
        <div id="signup-success" class="form-success"></div>

        <form id="signup-form" autocomplete="off" novalidate>
          <div class="form-group">
            <label for="signup-name">Full Name</label>
            <input type="text" id="signup-name" class="form-input" placeholder="Your name" autocomplete="name" />
            <div class="form-error"></div>
          </div>

          <div class="form-group">
            <label for="signup-email">Email</label>
            <input type="email" id="signup-email" class="form-input" placeholder="you@example.com" autocomplete="email" />
            <div class="form-error"></div>
          </div>

          <div class="form-group">
            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" class="form-input" placeholder="At least 6 characters" autocomplete="new-password" />
            <div class="form-error"></div>
          </div>

          <div class="form-group">
            <label for="signup-confirm">Confirm Password</label>
            <input type="password" id="signup-confirm" class="form-input" placeholder="Re-enter your password" autocomplete="new-password" />
            <div class="form-error"></div>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Create Account</button>
        </form>

        <div class="form-footer">
          Already have an account? <a href="login.html">Log in</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
