<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Mythos</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🏛️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="login">

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand"><span>M</span>ythos</a>
      <div class="navbar-links" id="nav-right">
        <a href="login.html">Login</a>
        <a href="signup.html" class="btn btn-primary btn-sm">Sign Up</a>
      </div>
    </div>
  </nav>

  <!-- Login Form -->
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-header">
        <div class="logo"><span>M</span>ythos</div>
        <h1>Welcome back</h1>
        <p>Log in to access your dashboard and API token.</p>
      </div>

      <div class="auth-card">
        <div id="login-alert" class="alert alert-error hidden"></div>

        <form id="login-form" autocomplete="off" novalidate>
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" class="form-input" placeholder="you@example.com" autocomplete="email" />
            <div class="form-error"></div>
          </div>

          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" class="form-input" placeholder="Your password" autocomplete="current-password" />
            <div class="form-error"></div>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Log In</button>
        </form>

        <div class="form-footer">
          Don't have an account? <a href="signup.html">Sign up</a>
        </div>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
